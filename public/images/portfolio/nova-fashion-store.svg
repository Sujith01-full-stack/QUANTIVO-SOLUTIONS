<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0a0a0a"/><stop offset="1" stop-color="#1a0e04"/>
    </linearGradient>
    <linearGradient id="oj" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FF8C33"/><stop offset="1" stop-color="#FF6A00"/>
    </linearGradient>
    <linearGradient id="scr1" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fafafa"/><stop offset="1" stop-color="#f0f0f0"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="45%" r="50%">
      <stop stop-color="rgba(255,106,0,0.28)"/><stop offset="1" stop-color="rgba(255,106,0,0)"/>
    </radialGradient>
    <filter id="sh1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="sh2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg1)"/>
  <circle cx="400" cy="230" r="240" fill="url(#glow1)"/>
  <circle cx="720" cy="60" r="2.5" fill="#FF6A00" opacity="0.5"/>
  <circle cx="70" cy="440" r="2" fill="#FF6A00" opacity="0.4"/>
  <circle cx="750" cy="400" r="2" fill="#FF6A00" opacity="0.35"/>
  <circle cx="50" cy="80" r="2.5" fill="#FF6A00" opacity="0.4"/>
  <circle cx="680" cy="460" r="1.5" fill="#FF6A00" opacity="0.3"/>
  <circle cx="120" cy="60" r="1.5" fill="#FF6A00" opacity="0.3"/>

  <!-- Laptop base shadow -->
  <ellipse cx="380" cy="392" rx="240" ry="14" fill="#000" opacity="0.4"/>

  <!-- Laptop body -->
  <g filter="url(#sh1)">
    <rect x="150" y="95" width="460" height="280" rx="14" fill="#111"/>
    <rect x="154" y="99" width="452" height="258" rx="11" fill="#000"/>
    <rect x="158" y="103" width="444" height="250" rx="9" fill="url(#scr1)"/>

    <!-- Laptop screen content: fashion site -->
    <!-- Top nav -->
    <rect x="158" y="103" width="444" height="32" fill="#fff"/>
    <circle cx="180" cy="119" r="8" fill="url(#oj)"/>
    <rect x="194" y="114" width="44" height="8" rx="4" fill="#111"/>
    <rect x="420" y="115" width="28" height="6" rx="3" fill="#ddd"/>
    <rect x="456" y="115" width="28" height="6" rx="3" fill="#ddd"/>
    <rect x="492" y="115" width="28" height="6" rx="3" fill="#ddd"/>
    <rect x="530" y="112" width="40" height="12" rx="6" fill="url(#oj)"/>
    <line x1="158" y1="135" x2="602" y2="135" stroke="#eee" stroke-width="1"/>

