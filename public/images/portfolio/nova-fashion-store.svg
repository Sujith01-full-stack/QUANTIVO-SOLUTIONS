  <!-- Floating category badge -->
  <g filter="url(#sh2)">
    <rect x="90" y="140" width="44" height="44" rx="12" fill="url(#oj)"/>
    <path d="M106 156 L118 156 L118 168 L106 168 Z" fill="#fff" opacity="0.9"/>
  </g>

  <text x="400" y="460" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FF6A00" text-anchor="middle" letter-spacing="3">NOVA FASHION STORE</text>
