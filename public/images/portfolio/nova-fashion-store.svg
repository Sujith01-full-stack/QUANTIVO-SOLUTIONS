    <rect x="170" y="145" width="420" height="90" rx="8" fill="#f5f0eb"/>
    <rect x="186" y="160" width="130" height="14" rx="4" fill="#111"/>
    <rect x="186" y="180" width="90" height="9" rx="4" fill="#999"/>
    <rect x="186" y="196" width="70" height="16" rx="8" fill="url(#oj)"/>
