    <circle cx="602" cy="203" r="5" fill="url(#oj)"/>
    <rect x="612" y="200" width="24" height="5" rx="2" fill="#111"/>
    <rect x="660" y="200" width="12" height="5" rx="2" fill="#ccc"/>

    <rect x="596" y="222" width="78" height="44" rx="6" fill="#f5f0eb"/>
    <rect x="602" y="230" width="40" height="7" rx="3" fill="#111"/>
    <rect x="602" y="242" width="26" height="5" rx="2" fill="#999"/>
    <rect x="602" y="252" width="32" height="10" rx="5" fill="url(#oj)"/>

    <rect x="596" y="274" width="36" height="40" rx="5" fill="#fff" stroke="#eee"/>
    <rect x="600" y="278" width="28" height="22" rx="3" fill="#e8ddd2"/>
    <rect x="602" y="304" width="18" height="4" rx="2" fill="#333"/>
    <rect x="602" y="310" width="10" height="3" rx="1.5" fill="url(#oj)"/>

    <rect x="638" y="274" width="36" height="40" rx="5" fill="#fff" stroke="#eee"/>
    <rect x="642" y="278" width="28" height="22" rx="3" fill="#e5dcd4"/>
    <rect x="644" y="304" width="18" height="4" rx="2" fill="#333"/>
    <rect x="644" y="310" width="10" height="3" rx="1.5" fill="url(#oj)"/>

    <rect x="596" y="322" width="78" height="16" rx="8" fill="url(#oj)"/>
    <rect x="620" y="366" width="30" height="4" rx="2" fill="#222"/>
