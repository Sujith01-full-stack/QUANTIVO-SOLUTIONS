    <ellipse cx="218" cy="272" rx="16" ry="16" fill="#c9b9a8"/>
    <path d="M200 296 L218 280 L236 296 Z" fill="url(#oj)"/>
    <rect x="178" y="312" width="56" height="7" rx="3" fill="#333"/>
    <rect x="178" y="323" width="32" height="6" rx="3" fill="url(#oj)"/>

    <rect x="278" y="248" width="96" height="90" rx="7" fill="#fff" stroke="#eee"/>
    <rect x="284" y="254" width="84" height="52" rx="5" fill="#e5dcd4"/>
    <ellipse cx="326" cy="272" rx="16" ry="16" fill="#c9b9a8"/>
    <rect x="308" y="286" width="36" height="22" rx="4" fill="url(#oj)"/>
    <rect x="286" y="312" width="56" height="7" rx="3" fill="#333"/>
    <rect x="286" y="323" width="32" height="6" rx="3" fill="url(#oj)"/>

    <rect x="386" y="248" width="96" height="90" rx="7" fill="#fff" stroke="#eee"/>
    <rect x="392" y="254" width="84" height="52" rx="5" fill="#eae0d5"/>
    <ellipse cx="434" cy="272" rx="16" ry="16" fill="#c9b9a8"/>
    <path d="M418 298 Q434 282 450 298" fill="url(#oj)"/>
    <rect x="394" y="312" width="56" height="7" rx="3" fill="#333"/>
    <rect x="394" y="323" width="32" height="6" rx="3" fill="url(#oj)"/>

    <rect x="494" y="248" width="96" height="90" rx="7" fill="#fff" stroke="#eee"/>
    <rect x="500" y="254" width="84" height="52" rx="5" fill="#e3d9ce"/>
    <ellipse cx="542" cy="272" rx="16" ry="16" fill="#c9b9a8"/>
    <rect x="526" y="286" width="32" height="20" rx="3" fill="#888"/>
    <rect x="502" y="312" width="56" height="7" rx="3" fill="#333"/>
    <rect x="502" y="323" width="32" height="6" rx="3" fill="url(#oj)"/>

    <!-- Laptop bottom bezel -->
    <rect x="154" y="357" width="452" height="18" rx="0" fill="#0d0d0d"/>
    <rect x="340" y="361" width="76" height="5" rx="2.5" fill="#1a1a1a"/>
  </g>

  <!-- Laptop base -->
  <path d="M110 375 H650 L630 392 H130 Z" fill="#161616"/>
  <path d="M110 375 H650 L630 392 H130 Z" fill="#1a1a1a" opacity="0.5"/>

  <!-- Phone -->
  <g filter="url(#sh2)">
    <rect x="580" y="180" width="110" height="210" rx="18" fill="#111"/>
    <rect x="584" y="184" width="102" height="202" rx="15" fill="#000"/>
    <rect x="588" y="188" width="94" height="194" rx="12" fill="#fafafa"/>
