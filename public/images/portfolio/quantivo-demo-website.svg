  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0a0a0a"/><stop offset="1" stop-color="#120a04"/>
    </linearGradient>
    <linearGradient id="oj2" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FF8C33"/><stop offset="1" stop-color="#FF6A00"/>
