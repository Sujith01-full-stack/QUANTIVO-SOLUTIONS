    <radialGradient id="glow2" cx="50%" cy="45%" r="50%">
      <stop stop-color="rgba(255,106,0,0.25)"/><stop offset="1" stop-color="rgba(255,106,0,0)"/>
    </radialGradient>
    <filter id="sh3" x="-20%" y="-20%" width="140%" height="140%">
