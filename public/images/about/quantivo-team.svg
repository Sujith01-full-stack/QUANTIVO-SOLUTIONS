<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" fill="none">
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="420" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f5f0ea"/><stop offset="1" stop-color="#e8ddd0"/>
    </linearGradient>
    <linearGradient id="toj" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FF8C33"/><stop offset="1" stop-color="#FF6A00"/>
    </linearGradient>
  </defs>
  <rect width="420" height="300" fill="url(#tbg)"/>
  <!-- Office background blur suggestion -->
  <rect x="0" y="0" width="420" height="120" fill="#e0d5c8" opacity="0.5"/>
  <rect x="30" y="20" width="80" height="60" rx="4" fill="#d4c8ba" opacity="0.6"/>
  <rect x="310" y="15" width="70" height="55" rx="4" fill="#d4c8ba" opacity="0.5"/>

  <!-- Desk -->
  <rect x="40" y="210" width="340" height="14" rx="4" fill="#c4b09a"/>
  <rect x="60" y="224" width="10" height="50" fill="#a89078"/>
  <rect x="350" y="224" width="10" height="50" fill="#a89078"/>

  <!-- Laptop center -->
  <rect x="165" y="160" width="90" height="55" rx="4" fill="#2a2a2a"/>
  <rect x="169" y="164" width="82" height="47" rx="2" fill="#0d1a2e"/>
  <rect x="178" y="172" width="40" height="6" rx="2" fill="url(#toj)"/>
  <rect x="178" y="184" width="56" height="4" rx="2" fill="#1e3a5f"/>
  <rect x="178" y="192" width="44" height="4" rx="2" fill="#1e3a5f"/>
  <rect x="150" y="215" width="120" height="6" rx="2" fill="#333"/>

  <!-- Person left (male, glasses) -->
  <circle cx="115" cy="110" r="28" fill="#d4a574"/>
  <path d="M87 110 Q87 75 115 75 Q143 75 143 110" fill="#1a1a1a"/>
  <rect x="95" y="100" width="16" height="10" rx="3" fill="none" stroke="#333" stroke-width="2"/>
  <rect x="119" y="100" width="16" height="10" rx="3" fill="none" stroke="#333" stroke-width="2"/>
  <line x1="111" y1="105" x2="119" y2="105" stroke="#333" stroke-width="2"/>
  <rect x="85" y="138" width="60" height="80" rx="10" fill="#1a1a1a"/>
  <rect x="70" y="155" width="24" height="14" rx="7" fill="#d4a574"/>
  <rect x="136" y="150" width="30" height="12" rx="6" fill="#d4a574"/>

  <!-- Person center (female) -->
  <circle cx="210" cy="105" r="26" fill="#e8b890"/>
  <path d="M184 105 Q184 68 210 68 Q236 68 236 105 L236 130 Q236 140 226 140 L194 140 Q184 140 184 130 Z" fill="#1a1008"/>
  <circle cx="200" cy="105" r="3" fill="#2a1a10"/>
  <circle cx="220" cy="105" r="3" fill="#2a1a10"/>
  <path d="M204 118 Q210 122 216 118" fill="none" stroke="#c07050" stroke-width="2" stroke-linecap="round"/>
  <rect x="182" y="132" width="56" height="85" rx="10" fill="#2a1a10"/>
  <rect x="170" y="150" width="22" height="13" rx="6" fill="#e8b890"/>
  <rect x="228" y="148" width="26" height="12" rx="6" fill="#e8b890"/>

  <!-- Person right (male) -->
  <circle cx="305" cy="112" r="27" fill="#c89060"/>
  <path d="M278 112 Q278 78 305 78 Q332 78 332 112" fill="#120c06"/>
  <circle cx="296" cy="110" r="3" fill="#1a1008"/>
  <circle cx="314" cy="110" r="3" fill="#1a1008"/>
  <path d="M299 122 Q305 126 311 122" fill="none" stroke="#a06040" stroke-width="2" stroke-linecap="round"/>
  <rect x="275" y="140" width="60" height="78" rx="10" fill="#1a1a1a"/>
  <rect x="260" y="158" width="24" height="13" rx="6" fill="#c89060"/>
  <rect x="326" y="152" width="28" height="12" rx="6" fill="#c89060"/>

  <!-- Orange accent on laptop lid edge -->
  <rect x="165" y="210" width="90" height="4" rx="2" fill="url(#toj)"/>
</svg>
